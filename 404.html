<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接不完整 · HRBP经营工作台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       color:#1f2329;padding:24px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:40px 44px;max-width:560px;width:100%;
        box-shadow:0 8px 28px rgba(15,23,42,.06)}
  .tag{display:inline-block;font-size:12px;letter-spacing:.08em;color:#8a6d3b;background:#fdf6e3;
       border:1px solid #f2e2b6;border-radius:999px;padding:4px 10px;margin-bottom:20px}
  h1{font-size:22px;font-weight:600;letter-spacing:.01em;margin-bottom:14px}
  p{font-size:14.5px;line-height:1.85;color:#4b5563}
  .url{margin:18px 0 6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;
       background:#f7f8fa;border:1px solid #eceef1;border-radius:10px;padding:12px 14px;color:#6b7280;
       word-break:break-all}
  .btn{display:inline-block;margin-top:26px;background:#1f6feb;color:#fff;text-decoration:none;
       font-size:15px;font-weight:600;border-radius:10px;padding:13px 26px;transition:.18s}
  .btn:hover{background:#1a5fd0}
  .hint{margin-top:22px;font-size:13px;color:#9aa1ab;line-height:1.8;border-top:1px solid #f0f1f3;padding-top:18px}
  code{font-family:ui-monospace,Consolas,monospace;background:#f2f3f5;border-radius:4px;padding:1px 6px;color:#374151}
</style>
</head>
<body>
  <div class="card">
    <span class="tag">404 · 链接不完整</span>
    <h1>这个地址不是工作台首页</h1>
    <p>多半是从聊天记录里复制链接时，把后面的说明文字（比如「（密码 zhkj2026）」）一起带进来了。GitHub Pages 会把它当成文件路径去找，自然找不到。</p>
    <div class="url" id="bad"></div>
    <a class="btn" id="go" href="/hrbp-workbench/">进入工作台 →</a>
    <div class="hint">
      正确地址：<code>https://15750767173.github.io/hrbp-workbench/</code><br>
      访问密码：<code>zhkj2026</code><br>
      <span id="cd">3</span> 秒后自动跳转…
    </div>
  </div>
<script>
  var ROOT = "/hrbp-workbench/";
  try { document.getElementById("bad").textContent = decodeURIComponent(location.href); } catch (e) {
    document.getElementById("bad").textContent = location.href;
  }
  var n = 3, el = document.getElementById("cd");
  var t = setInterval(function () {
    n -= 1; if (el) el.textContent = n;
    if (n <= 0) { clearInterval(t); location.replace(ROOT); }
  }, 1000);
</script>
</body>
</html>
